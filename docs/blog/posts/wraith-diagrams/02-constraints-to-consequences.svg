<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 452" font-family="'Kalam', 'Comic Sans MS', cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="sk2" x="-2%" y="-4%" width="104%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="m2" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="764" height="452" fill="#ffffff"/>
  <text x="22" y="32" font-size="20" font-weight="700" fill="#1e1e1e">Five constraints decided every choice</text>
  <text x="22" y="53" font-size="12.5" fill="#868e96">not preferences — consequences. each one is enforced by a mechanism, not a promise.</text>

  <text x="24" y="80" font-size="11.5" font-weight="700" fill="#495057">THE CONSTRAINT</text>
  <text x="300" y="80" font-size="11.5" font-weight="700" fill="#495057">WHAT IT FORCED</text>
  <text x="596" y="80" font-size="11.5" font-weight="700" fill="#14532d">ENFORCED BY</text>

  <g filter="url(#sk2)">
    <rect x="22" y="90" width="248" height="58" rx="7" fill="#eef2ff" stroke="#1f4bd8" stroke-width="2"/>
    <rect x="22" y="160" width="248" height="58" rx="7" fill="#eef2ff" stroke="#1f4bd8" stroke-width="2"/>
    <rect x="22" y="230" width="248" height="58" rx="7" fill="#eef2ff" stroke="#1f4bd8" stroke-width="2"/>
    <rect x="22" y="300" width="248" height="58" rx="7" fill="#eef2ff" stroke="#1f4bd8" stroke-width="2"/>
    <rect x="22" y="370" width="248" height="58" rx="7" fill="#eef2ff" stroke="#1f4bd8" stroke-width="2"/>

    <rect x="588" y="90" width="154" height="58" rx="7" fill="#b2f2bb" stroke="#14532d" stroke-width="1.8"/>
    <rect x="588" y="160" width="154" height="58" rx="7" fill="#b2f2bb" stroke="#14532d" stroke-width="1.8"/>
    <rect x="588" y="230" width="154" height="58" rx="7" fill="#b2f2bb" stroke="#14532d" stroke-width="1.8"/>
    <rect x="588" y="300" width="154" height="58" rx="7" fill="#b2f2bb" stroke="#14532d" stroke-width="1.8"/>
    <rect x="588" y="370" width="154" height="58" rx="7" fill="#b2f2bb" stroke="#14532d" stroke-width="1.8"/>

    <line x1="274" y1="119" x2="296" y2="119" stroke="#495057" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="274" y1="189" x2="296" y2="189" stroke="#495057" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="274" y1="259" x2="296" y2="259" stroke="#495057" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="274" y1="329" x2="296" y2="329" stroke="#495057" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="274" y1="399" x2="296" y2="399" stroke="#495057" stroke-width="2" marker-end="url(#m2)"/>

    <line x1="562" y1="119" x2="582" y2="119" stroke="#495057" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="562" y1="189" x2="582" y2="189" stroke="#495057" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="562" y1="259" x2="582" y2="259" stroke="#495057" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="562" y1="329" x2="582" y2="329" stroke="#495057" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="562" y1="399" x2="582" y2="399" stroke="#495057" stroke-width="2" marker-end="url(#m2)"/>
  </g>

  <!-- 1 offline -->
  <text x="38" y="114" font-size="13.5" font-weight="700" fill="#1f4bd8">no network egress</text>
  <text x="38" y="134" font-size="11" fill="#495057">ever, at runtime</text>
  <text x="300" y="108" font-size="12" fill="#1e1e1e">in-process store, not a server</text>
  <text x="300" y="126" font-size="12" fill="#1e1e1e">no native PDF engine · self-hosted fonts</text>
  <text x="300" y="144" font-size="12" fill="#1e1e1e">pure-Python wheels preferred</text>
  <text x="665" y="115" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">build greps the</text>
  <text x="665" y="130" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">bundle for URLs</text>

  <!-- 2 provenance -->
  <text x="38" y="184" font-size="13.5" font-weight="700" fill="#1f4bd8">provenance everywhere</text>
  <text x="38" y="204" font-size="11" fill="#495057">on every entity &amp; edge</text>
  <text x="300" y="184" font-size="12" fill="#1e1e1e">a store with native nested types —</text>
  <text x="300" y="202" font-size="12" fill="#1e1e1e">provenance rides IN the row, no join</text>
  <text x="665" y="185" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">unregistered file</text>
  <text x="665" y="200" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">→ raises KeyError</text>

  <!-- 3 secrets -->
  <text x="38" y="254" font-size="13.5" font-weight="700" fill="#1f4bd8">secrets sealed</text>
  <text x="38" y="274" font-size="11" fill="#495057">encrypted · redacted · never logged</text>
  <text x="300" y="254" font-size="12" fill="#1e1e1e">Argon2id + AES-256-GCM, with AAD</text>
  <text x="300" y="272" font-size="12" fill="#1e1e1e">binding ciphertext to its case + run</text>
  <text x="665" y="255" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">test greps store</text>
  <text x="665" y="270" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">bytes for plaintext</text>

  <!-- 4 determinism -->
  <text x="38" y="324" font-size="13.5" font-weight="700" fill="#1f4bd8">determinism</text>
  <text x="38" y="344" font-size="11" fill="#495057">same input → same bytes</text>
  <text x="300" y="317" font-size="12" fill="#1e1e1e">content-derived edge primary keys</text>
  <text x="300" y="335" font-size="12" fill="#1e1e1e">naive-UTC everywhere · canonical JSON</text>
  <text x="300" y="353" font-size="12" fill="#1e1e1e">fixed zip dates</text>
  <text x="665" y="325" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">44 tests: two runs</text>
  <text x="665" y="340" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">byte-identical</text>

  <!-- 5 untrusted -->
  <text x="38" y="394" font-size="13.5" font-weight="700" fill="#1f4bd8">input is untrusted</text>
  <text x="38" y="414" font-size="11" fill="#495057">it came off a suspect disk</text>
  <text x="300" y="387" font-size="12" fill="#1e1e1e">isolated-mode launch · path containment</text>
  <text x="300" y="405" font-size="12" fill="#1e1e1e">zip-slip &amp; symlink rejection</text>
  <text x="300" y="423" font-size="12" fill="#1e1e1e">caps enforced while streaming</text>
  <text x="665" y="395" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">refuses to start</text>
  <text x="665" y="410" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">without python -I</text>
</svg>
