<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 452" font-family="'Kalam', 'Comic Sans MS', cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="sk7" x="-2%" y="-3%" width="104%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="764" height="452" fill="#ffffff"/>
  <text x="22" y="32" font-size="20" font-weight="700" fill="#1e1e1e">Three test layers — against a failure that isn't a crash</text>
  <text x="22" y="53" font-size="12.5" fill="#868e96">47 files · 835 tests · 19,426 lines of test code</text>

  <g filter="url(#sk7)">
    <rect x="22" y="74" width="232" height="186" rx="8" fill="#eef2ff" stroke="#1f4bd8" stroke-width="2.2"/>
    <rect x="266" y="74" width="232" height="186" rx="8" fill="#f3e8ff" stroke="#6741d9" stroke-width="2.2"/>
    <rect x="510" y="74" width="232" height="186" rx="8" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2.2"/>

    <rect x="22" y="282" width="720" height="68" rx="8" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2.2"/>
    <rect x="22" y="366" width="720" height="70" rx="8" fill="#ffffff" stroke="#14532d" stroke-width="2"/>
  </g>

  <!-- layer 1 -->
  <text x="138" y="98" font-size="12.5" font-weight="700" fill="#1f4bd8" text-anchor="middle">LAYER 1 — unit / golden</text>
  <text x="38" y="124" font-size="11" fill="#1e1e1e">Small pure functions against</text>
  <text x="38" y="140" font-size="11" fill="#1e1e1e">known answers.</text>
  <text x="38" y="164" font-size="10.5" fill="#495057">• crafted security-descriptor</text>
  <text x="46" y="178" font-size="10.5" fill="#495057">bytes with KNOWN ACEs</text>
  <text x="38" y="196" font-size="10.5" fill="#495057">• SHA-256 vs FIPS 180-4 vectors</text>
  <text x="38" y="214" font-size="10.5" fill="#495057">• decoder golden tests</text>
  <text x="138" y="242" font-size="10" font-weight="700" fill="#8a6d00" text-anchor="middle">the engine is built pure</text>
  <text x="138" y="254" font-size="10" font-weight="700" fill="#8a6d00" text-anchor="middle">SO it can be tested this way</text>

  <!-- layer 2 -->
  <text x="382" y="98" font-size="12.5" font-weight="700" fill="#6741d9" text-anchor="middle">LAYER 2 — re-derivation</text>
  <text x="282" y="124" font-size="11" fill="#1e1e1e">The gate suite is written by a</text>
  <text x="282" y="140" font-size="11" fill="#1e1e1e">DIFFERENT agent, and</text>
  <text x="282" y="156" font-size="11" font-weight="700" fill="#6741d9">refuses to trust the coder's tests.</text>
  <text x="282" y="180" font-size="10.5" fill="#495057">• every holder set re-derived</text>
  <text x="290" y="194" font-size="10.5" fill="#495057">from the raw tables, in-test</text>
  <text x="282" y="212" font-size="10.5" fill="#495057">• real-DC oracles pinned as</text>
  <text x="290" y="226" font-size="10.5" fill="#495057">literals: 390 nodes, 30,303 edges</text>
  <text x="382" y="250" font-size="10" font-weight="700" fill="#8a6d00" text-anchor="middle">drift = a test failure</text>

  <!-- layer 3 -->
  <text x="626" y="98" font-size="12.5" font-weight="700" fill="#c92a2a" text-anchor="middle">LAYER 3 — robustness</text>
  <text x="526" y="124" font-size="11" fill="#1e1e1e">Malformed, truncated and</text>
  <text x="526" y="140" font-size="11" fill="#1e1e1e">hostile input must degrade to</text>
  <text x="526" y="156" font-size="11" font-weight="700" fill="#c92a2a">a COUNTED gap.</text>
  <text x="526" y="180" font-size="10.5" fill="#495057">• ~90 named gap constants</text>
  <text x="526" y="198" font-size="10.5" fill="#495057">• ~70 tests proving each is</text>
  <text x="534" y="212" font-size="10.5" fill="#495057">reachable, not swallowed</text>
  <text x="526" y="230" font-size="10.5" fill="#495057">• zip-slip · symlinks · bombs</text>
  <text x="626" y="252" font-size="10" font-weight="700" fill="#8a6d00" text-anchor="middle">a clean DB never hits those</text>
  <text x="626" y="264" font-size="10" font-weight="700" fill="#8a6d00" text-anchor="middle">branches — so we fake one</text>

  <!-- the rule -->
  <text x="382" y="306" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="middle">THE RULE UNDERNEATH ALL THREE</text>
  <text x="382" y="330" font-size="14" font-weight="700" fill="#7a1a1a" text-anchor="middle">malformed input → a counted, logged gap. never a silent wrong answer.</text>

  <!-- why -->
  <text x="382" y="390" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">because the failure mode here is not an exception</text>
  <text x="382" y="412" font-size="11.5" fill="#1e1e1e" text-anchor="middle">"These are not crashes. They are <tspan font-weight="700">plausible wrong answers</tspan> — the worst outcome for forensics —</text>
  <text x="382" y="428" font-size="11.5" fill="#1e1e1e" text-anchor="middle">and they are exactly what a code reviewer or a type checker would never catch."</text>
</svg>
