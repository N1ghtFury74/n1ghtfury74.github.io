<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 440" font-family="'Kalam', 'Comic Sans MS', cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="sk4" x="-2%" y="-3%" width="104%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="764" height="440" fill="#ffffff"/>
  <text x="22" y="32" font-size="20" font-weight="700" fill="#1e1e1e">Ten tables, four groups — and what's frozen</text>
  <text x="22" y="53" font-size="12.5" fill="#868e96">the freeze governs the product (entities + edges), not the plumbing</text>

  <g filter="url(#sk4)">
    <!-- group 1: provenance -->
    <rect x="22" y="76" width="168" height="110" rx="8" fill="#fff" stroke="#7a1a1a" stroke-width="2.2"/>
    <rect x="36" y="118" width="140" height="54" rx="6" fill="#ffffff" stroke="#c92a2a" stroke-width="1.8"/>

    <!-- group 2: canonical entities (FROZEN) -->
    <rect x="206" y="76" width="286" height="190" rx="8" fill="#eef2ff" stroke="#1f4bd8" stroke-width="3"/>
    <rect x="220" y="124" width="124" height="30" rx="5" fill="#fff" stroke="#1f4bd8" stroke-width="1.6"/>
    <rect x="354" y="124" width="124" height="30" rx="5" fill="#fff" stroke="#1f4bd8" stroke-width="1.6"/>
    <rect x="220" y="162" width="124" height="30" rx="5" fill="#fff" stroke="#1f4bd8" stroke-width="1.6"/>
    <rect x="354" y="162" width="124" height="30" rx="5" fill="#fff" stroke="#1f4bd8" stroke-width="1.6"/>
    <rect x="220" y="200" width="124" height="30" rx="5" fill="#fff" stroke="#1f4bd8" stroke-width="1.6"/>

    <!-- group 3: relationships (FROZEN edge) -->
    <rect x="508" y="76" width="234" height="190" rx="8" fill="#fff" stroke="#6741d9" stroke-width="3"/>
    <rect x="522" y="124" width="206" height="44" rx="6" fill="#fff" stroke="#6741d9" stroke-width="1.8"/>
    <rect x="522" y="178" width="206" height="44" rx="6" fill="#fff" stroke="#adb5bd" stroke-width="1.8" stroke-dasharray="5 4"/>

    <!-- group 4: staging (NOT frozen) -->
    <rect x="22" y="206" width="168" height="110" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="36" y="244" width="140" height="28" rx="5" fill="#fff" stroke="#868e96" stroke-width="1.6"/>
    <rect x="36" y="278" width="140" height="28" rx="5" fill="#fff" stroke="#868e96" stroke-width="1.6"/>

    <!-- the universal block -->
    <rect x="22" y="336" width="720" height="86" rx="8" fill="#b2f2bb" stroke="#14532d" stroke-width="2.2"/>
  </g>

  <!-- group 1 labels -->
  <text x="106" y="98" font-size="12" font-weight="700" fill="#7a1a1a" text-anchor="middle">PROVENANCE</text>
  <text x="106" y="112" font-size="9.5" fill="#868e96" text-anchor="middle">write-once, append-only</text>
  <text x="106" y="140" font-size="11.5" font-weight="700" fill="#c92a2a" text-anchor="middle">provenance_ledger</text>
  <text x="106" y="156" font-size="9.5" fill="#495057" text-anchor="middle">SHA-256 hash chain</text>
  <text x="106" y="167" font-size="9.5" fill="#495057" text-anchor="middle">coverage + skip counts</text>

  <!-- group 2 labels -->
  <text x="349" y="100" font-size="13" font-weight="700" fill="#1f4bd8" text-anchor="middle">CANONICAL ENTITIES</text>
  <text x="349" y="116" font-size="10" font-weight="700" fill="#8a6d00" text-anchor="middle">🔒 THE FROZEN CONTRACT</text>
  <text x="282" y="144" font-size="11" font-weight="700" fill="#1f4bd8" text-anchor="middle">principal</text>
  <text x="416" y="144" font-size="11" font-weight="700" fill="#1f4bd8" text-anchor="middle">container</text>
  <text x="282" y="182" font-size="11" font-weight="700" fill="#1f4bd8" text-anchor="middle">gpo</text>
  <text x="416" y="182" font-size="11" font-weight="700" fill="#1f4bd8" text-anchor="middle">trust</text>
  <text x="282" y="220" font-size="11" font-weight="700" fill="#1f4bd8" text-anchor="middle">adcs</text>
  <text x="416" y="215" font-size="9.5" fill="#868e96" text-anchor="middle">user/computer/group in</text>
  <text x="416" y="227" font-size="9.5" fill="#868e96" text-anchor="middle">ONE discriminated table</text>
  <text x="349" y="254" font-size="10" fill="#495057" text-anchor="middle">rejected: three per-type principal tables</text>

  <!-- group 3 labels -->
  <text x="625" y="100" font-size="13" font-weight="700" fill="#6741d9" text-anchor="middle">RELATIONSHIPS</text>
  <text x="625" y="116" font-size="10" font-weight="700" fill="#8a6d00" text-anchor="middle">🔒 edge is frozen too</text>
  <text x="625" y="142" font-size="12" font-weight="700" fill="#6741d9" text-anchor="middle">edge</text>
  <text x="625" y="158" font-size="9.5" fill="#495057" text-anchor="middle">one table, 49 kinds · content-derived PK</text>
  <text x="625" y="196" font-size="12" font-weight="700" fill="#495057" text-anchor="middle">effective_membership</text>
  <text x="625" y="212" font-size="9.5" fill="#868e96" text-anchor="middle">derived: cycle-guarded closure</text>
  <text x="625" y="254" font-size="10" fill="#495057" text-anchor="middle">adding an edge kind is data, not a migration</text>

  <!-- group 4 labels -->
  <text x="106" y="228" font-size="12" font-weight="700" fill="#495057" text-anchor="middle">STAGING</text>
  <text x="106" y="241" font-size="9.5" fill="#868e96" text-anchor="middle">deliberately NOT frozen</text>
  <text x="106" y="262" font-size="10.5" font-weight="700" fill="#495057" text-anchor="middle">staging_object</text>
  <text x="106" y="296" font-size="10.5" font-weight="700" fill="#495057" text-anchor="middle">staging_link</text>
  <text x="106" y="330" font-size="9.5" fill="#868e96" text-anchor="middle">parser → engine handoff</text>

  <!-- universal block labels -->
  <text x="382" y="358" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">ON EVERY SINGLE TABLE — each one a decision, not boilerplate</text>
  <text x="38" y="380" font-size="11.5" font-weight="700" fill="#14532d">node_id PRIMARY KEY</text>
  <text x="38" y="396" font-size="10.5" fill="#1e1e1e">dedup + reproducibility</text>
  <text x="272" y="380" font-size="11.5" font-weight="700" fill="#14532d">forest_id · domain_id · domain_fqdn</text>
  <text x="272" y="396" font-size="10.5" fill="#1e1e1e">multi-forest from day one, on a single-forest tool</text>
  <text x="272" y="411" font-size="10" fill="#495057">— because retrofitting a scope column across a frozen schema never happens cleanly</text>
  <text x="38" y="411" font-size="10" fill="#495057">provenance STRUCT(...)</text>
</svg>
