<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 486" font-family="'Kalam', 'Comic Sans MS', cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="sk8" x="-2%" y="-3%" width="104%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="m8" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="764" height="486" fill="#ffffff"/>
  <text x="22" y="32" font-size="20" font-weight="700" fill="#1e1e1e">The GOAD run — one lab, two different claims</text>
  <text x="22" y="53" font-size="12.5" fill="#868e96">planned, not yet run. a stress test and a parity test are not the same thing.</text>

  <g filter="url(#sk8)">
    <!-- today -->
    <rect x="22" y="74" width="196" height="96" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
    <!-- goad -->
    <rect x="276" y="74" width="212" height="96" rx="8" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2.5"/>
    <!-- sharphound -->
    <rect x="546" y="74" width="196" height="96" rx="8" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2.2"/>

    <line x1="222" y1="122" x2="270" y2="122" stroke="#495057" stroke-width="2.5" marker-end="url(#m8)"/>
    <line x1="492" y1="122" x2="540" y2="122" stroke="#495057" stroke-width="2.5" marker-end="url(#m8)"/>

    <!-- two claims -->
    <rect x="22" y="200" width="352" height="104" rx="8" fill="#eef2ff" stroke="#1f4bd8" stroke-width="2.2"/>
    <rect x="390" y="200" width="352" height="104" rx="8" fill="#f3e8ff" stroke="#6741d9" stroke-width="2.2"/>

    <!-- divergence table -->
    <rect x="22" y="326" width="720" height="142" rx="8" fill="#ffffff" stroke="#14532d" stroke-width="2"/>
    <line x1="22" y1="356" x2="742" y2="356" stroke="#adb5bd" stroke-width="1.5"/>
    <line x1="262" y1="326" x2="262" y2="468" stroke="#adb5bd" stroke-width="1.5"/>
    <line x1="502" y1="326" x2="502" y2="468" stroke="#adb5bd" stroke-width="1.5"/>
  </g>

  <!-- today -->
  <text x="120" y="96" font-size="11.5" font-weight="700" fill="#495057" text-anchor="middle">TODAY'S FIXTURE</text>
  <text x="120" y="118" font-size="12.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">one CTF DC</text>
  <text x="120" y="136" font-size="11" fill="#495057" text-anchor="middle">390 nodes · 30,302 edges</text>
  <text x="120" y="152" font-size="10.5" fill="#868e96" text-anchor="middle">single domain, no AD CS,</text>
  <text x="120" y="164" font-size="10.5" fill="#868e96" text-anchor="middle">no trusts, no delegation</text>

  <!-- goad -->
  <text x="382" y="96" font-size="11.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">THE GOAD LAB</text>
  <text x="382" y="118" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">multi-domain, multi-forest</text>
  <text x="382" y="138" font-size="11" fill="#1e1e1e" text-anchor="middle">trusts · delegation · AD CS · gMSA</text>
  <text x="382" y="156" font-size="10.5" font-weight="700" fill="#7a1a1a" text-anchor="middle">exercises the 34 edge kinds that</text>
  <text x="382" y="167" font-size="10.5" font-weight="700" fill="#7a1a1a" text-anchor="middle">are synthetic-only today</text>

  <!-- sharphound -->
  <text x="644" y="96" font-size="11.5" font-weight="700" fill="#7a1a1a" text-anchor="middle">THE INDEPENDENT ORACLE</text>
  <text x="644" y="118" font-size="12.5" font-weight="700" fill="#c92a2a" text-anchor="middle">SharpHound, live</text>
  <text x="644" y="138" font-size="11" fill="#495057" text-anchor="middle">a different implementation</text>
  <text x="644" y="152" font-size="11" fill="#495057" text-anchor="middle">of the same concept,</text>
  <text x="644" y="166" font-size="11" fill="#495057" text-anchor="middle">by different people</text>

  <!-- claim 1: stress -->
  <text x="198" y="224" font-size="13" font-weight="700" fill="#1f4bd8" text-anchor="middle">CLAIM 1 — STRESS / SCALE</text>
  <text x="38" y="248" font-size="11" fill="#1e1e1e">Does it hold up on a domain far larger and</text>
  <text x="38" y="263" font-size="11" fill="#1e1e1e">messier than the one it was built against?</text>
  <text x="38" y="283" font-size="10.5" fill="#495057">bounded time · bounded memory · no OOM on</text>
  <text x="38" y="296" font-size="10.5" fill="#495057">the closure · pathfinder caps hold under load</text>

  <!-- claim 2: parity -->
  <text x="566" y="224" font-size="13" font-weight="700" fill="#6741d9" text-anchor="middle">CLAIM 2 — DIFFERENTIAL PARITY</text>
  <text x="406" y="248" font-size="11" fill="#1e1e1e">Do two independent implementations agree</text>
  <text x="406" y="263" font-size="11" fill="#1e1e1e">about the same domain?</text>
  <text x="406" y="283" font-size="10.5" fill="#495057">divergence means one of the two is wrong —</text>
  <text x="406" y="296" font-size="10.5" fill="#495057">and the interesting work is explaining which</text>

  <!-- divergence table -->
  <text x="382" y="347" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">THE EXPECTED DIVERGENCE — all three predictable in advance</text>

  <text x="142" y="378" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="middle">BloodHound only</text>
  <text x="142" y="400" font-size="10.5" fill="#1e1e1e" text-anchor="middle">live sessions, live</text>
  <text x="142" y="414" font-size="10.5" fill="#1e1e1e" text-anchor="middle">group enumeration</text>
  <text x="142" y="438" font-size="10" font-weight="700" fill="#7a1a1a" text-anchor="middle">WRAITH sends zero</text>
  <text x="142" y="450" font-size="10" font-weight="700" fill="#7a1a1a" text-anchor="middle">packets — it CANNOT</text>
  <text x="142" y="462" font-size="10" font-weight="700" fill="#7a1a1a" text-anchor="middle">see these. by design.</text>

  <text x="382" y="378" font-size="12" font-weight="700" fill="#1f4bd8" text-anchor="middle">WRAITH only</text>
  <text x="382" y="400" font-size="10.5" fill="#1e1e1e" text-anchor="middle">tombstoned objects,</text>
  <text x="382" y="414" font-size="10.5" fill="#1e1e1e" text-anchor="middle">SID history, secret</text>
  <text x="382" y="428" font-size="10.5" fill="#1e1e1e" text-anchor="middle">exposure facts</text>
  <text x="382" y="450" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">reading the database</text>
  <text x="382" y="462" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">beats querying the DC</text>

  <text x="622" y="378" font-size="12" font-weight="700" fill="#6741d9" text-anchor="middle">both, different counts</text>
  <text x="622" y="400" font-size="10.5" fill="#1e1e1e" text-anchor="middle">ACL pruning policy —</text>
  <text x="622" y="414" font-size="10.5" fill="#1e1e1e" text-anchor="middle">BH filters "boring"</text>
  <text x="622" y="428" font-size="10.5" fill="#1e1e1e" text-anchor="middle">ACEs aggressively</text>
  <text x="622" y="450" font-size="10" font-weight="700" fill="#3a2f6b" text-anchor="middle">neither is wrong. it</text>
  <text x="622" y="462" font-size="10" font-weight="700" fill="#3a2f6b" text-anchor="middle">depends what the</text>
  <text x="622" y="474" font-size="10" font-weight="700" fill="#3a2f6b" text-anchor="middle">graph is FOR.</text>
</svg>
