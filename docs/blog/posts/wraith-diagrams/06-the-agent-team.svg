<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 486" font-family="'Kalam', 'Comic Sans MS', cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="sk6" x="-2%" y="-3%" width="104%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="m6" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m6r" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#c92a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="764" height="486" fill="#ffffff"/>
  <text x="22" y="32" font-size="20" font-weight="700" fill="#1e1e1e">Nine agents, one architect — and tool grants as an org chart</text>
  <text x="22" y="53" font-size="12.5" fill="#868e96">the boundaries are enforced by which tools each agent has, not by asking nicely</text>

  <g filter="url(#sk6)">
    <!-- the human -->
    <rect x="22" y="74" width="120" height="78" rx="8" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2.5"/>

    <!-- the chain -->
    <rect x="166" y="80" width="116" height="66" rx="7" fill="#f3e8ff" stroke="#6741d9" stroke-width="2"/>
    <rect x="306" y="80" width="116" height="66" rx="7" fill="#eef2ff" stroke="#1f4bd8" stroke-width="2"/>
    <rect x="446" y="80" width="116" height="66" rx="7" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
    <rect x="586" y="80" width="116" height="66" rx="7" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>

    <!-- tester row -->
    <rect x="306" y="186" width="256" height="62" rx="7" fill="#b2f2bb" stroke="#14532d" stroke-width="2.2"/>

    <!-- gate -->
    <rect x="586" y="186" width="116" height="62" rx="7" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2.2"/>

    <!-- arrows along the chain -->
    <line x1="146" y1="113" x2="160" y2="113" stroke="#495057" stroke-width="2" marker-end="url(#m6)"/>
    <line x1="286" y1="113" x2="300" y2="113" stroke="#495057" stroke-width="2" marker-end="url(#m6)"/>
    <line x1="426" y1="113" x2="440" y2="113" stroke="#495057" stroke-width="2" marker-end="url(#m6)"/>
    <line x1="566" y1="113" x2="580" y2="113" stroke="#495057" stroke-width="2" marker-end="url(#m6)"/>
    <line x1="644" y1="150" x2="500" y2="182" stroke="#495057" stroke-width="2" marker-end="url(#m6)"/>
    <line x1="566" y1="217" x2="580" y2="217" stroke="#495057" stroke-width="2" marker-end="url(#m6)"/>
    <!-- FAIL loop back to coder -->
    <line x1="606" y1="252" x2="364" y2="292" stroke="#c92a2a" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="364" y1="292" x2="364" y2="152" stroke="#c92a2a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m6r)"/>

    <!-- the three questions panel -->
    <rect x="22" y="314" width="720" height="158" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/>
    <line x1="262" y1="348" x2="262" y2="462" stroke="#adb5bd" stroke-width="1.5"/>
    <line x1="502" y1="348" x2="502" y2="462" stroke="#adb5bd" stroke-width="1.5"/>
  </g>

  <!-- human -->
  <text x="82" y="100" font-size="12.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">THE ARCHITECT</text>
  <text x="82" y="118" font-size="10" fill="#1e1e1e" text-anchor="middle">constraints · schema</text>
  <text x="82" y="131" font-size="10" fill="#1e1e1e" text-anchor="middle">rulings · veto</text>
  <text x="82" y="146" font-size="9.5" font-weight="700" fill="#7a1a1a" text-anchor="middle">writes no code</text>

  <!-- chain labels -->
  <text x="224" y="100" font-size="12" font-weight="700" fill="#6741d9" text-anchor="middle">researcher</text>
  <text x="224" y="117" font-size="9.5" fill="#495057" text-anchor="middle">cited report, then</text>
  <text x="224" y="129" font-size="9.5" fill="#495057" text-anchor="middle">decisions LOCKED</text>
  <text x="224" y="142" font-size="9" font-weight="700" fill="#2f9e44" text-anchor="middle">+web</text>

  <text x="364" y="100" font-size="12" font-weight="700" fill="#1f4bd8" text-anchor="middle">coder</text>
  <text x="364" y="117" font-size="9.5" fill="#495057" text-anchor="middle">exactly ONE module</text>
  <text x="364" y="129" font-size="9.5" fill="#495057" text-anchor="middle">cannot declare it done</text>
  <text x="364" y="142" font-size="9" font-weight="700" fill="#c92a2a" text-anchor="middle">NO web</text>

  <text x="504" y="100" font-size="12" font-weight="700" fill="#e8590c" text-anchor="middle">reviewer</text>
  <text x="504" y="117" font-size="9.5" fill="#495057" text-anchor="middle">quality · safety</text>
  <text x="504" y="129" font-size="9.5" fill="#495057" text-anchor="middle">licence hygiene</text>
  <text x="504" y="142" font-size="9" font-weight="700" fill="#c92a2a" text-anchor="middle">NO edit, NO write</text>

  <text x="644" y="100" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="middle">domain expert</text>
  <text x="644" y="117" font-size="9.5" fill="#495057" text-anchor="middle">is the AD logic</text>
  <text x="644" y="129" font-size="9.5" fill="#495057" text-anchor="middle">actually TRUE?</text>
  <text x="644" y="142" font-size="9" font-weight="700" fill="#c92a2a" text-anchor="middle">NO bash</text>

  <!-- tester -->
  <text x="434" y="208" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">tester — the gatekeeper</text>
  <text x="434" y="225" font-size="10" fill="#1e1e1e" text-anchor="middle">writes its OWN suite · refuses to trust the coder's tests</text>
  <text x="434" y="240" font-size="10" fill="#1e1e1e" text-anchor="middle">never softens a verdict · may not fix prod code</text>

  <!-- gate -->
  <text x="644" y="208" font-size="12.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">GATE</text>
  <text x="644" y="225" font-size="9.5" fill="#1e1e1e" text-anchor="middle">PASS + sign-off</text>
  <text x="644" y="239" font-size="9.5" font-weight="700" fill="#7a1a1a" text-anchor="middle">= done</text>
  <text x="478" y="288" font-size="10.5" font-weight="700" fill="#c92a2a">FAIL → one consolidated fix → re-test</text>

  <!-- three questions panel -->
  <text x="382" y="338" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">THREE REVIEWERS, THREE DIFFERENT QUESTIONS — and that is the point</text>

  <text x="142" y="366" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">tester asks</text>
  <text x="142" y="386" font-size="11" fill="#1e1e1e" text-anchor="middle">does it match</text>
  <text x="142" y="400" font-size="11" fill="#1e1e1e" text-anchor="middle">ground truth?</text>
  <text x="142" y="428" font-size="10" fill="#868e96" text-anchor="middle">cannot catch a wrong</text>
  <text x="142" y="441" font-size="10" fill="#868e96" text-anchor="middle">SPECIFICATION</text>

  <text x="382" y="366" font-size="12" font-weight="700" fill="#e8590c" text-anchor="middle">reviewer asks</text>
  <text x="382" y="386" font-size="11" fill="#1e1e1e" text-anchor="middle">is the code good,</text>
  <text x="382" y="400" font-size="11" fill="#1e1e1e" text-anchor="middle">safe, licence-clean?</text>
  <text x="382" y="428" font-size="10" fill="#868e96" text-anchor="middle">found secrets leaking to</text>
  <text x="382" y="441" font-size="10" fill="#868e96" text-anchor="middle">the UNencrypted store</text>

  <text x="622" y="366" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="middle">domain expert asks</text>
  <text x="622" y="386" font-size="11" fill="#1e1e1e" text-anchor="middle">is this how the</text>
  <text x="622" y="400" font-size="11" fill="#1e1e1e" text-anchor="middle">attack really works?</text>
  <text x="622" y="428" font-size="10" font-weight="700" fill="#7a1a1a" text-anchor="middle">caught false cert paths a</text>
  <text x="622" y="441" font-size="10" font-weight="700" fill="#7a1a1a" text-anchor="middle">GREEN suite had passed</text>

  <text x="382" y="462" font-size="11" font-weight="700" fill="#8a6d00" text-anchor="middle">the tests were green because they came from the same wrong spec as the code</text>
</svg>
