<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 476" font-family="'Kalam', 'Comic Sans MS', cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="sk3" x="-2%" y="-3%" width="104%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="m3" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m3g" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="764" height="476" fill="#ffffff"/>
  <text x="22" y="32" font-size="20" font-weight="700" fill="#1e1e1e">The pipeline — one way, no shortcuts</text>
  <text x="22" y="53" font-size="12.5" fill="#868e96">nothing flows backward, and nothing skips the canonical graph</text>

  <g filter="url(#sk3)">
    <!-- inputs -->
    <rect x="22" y="76" width="140" height="26" rx="5" fill="#ffffff" stroke="#0b3d66" stroke-width="1.8"/>
    <rect x="22" y="110" width="140" height="26" rx="5" fill="#ffffff" stroke="#0b3d66" stroke-width="1.8"/>
    <rect x="22" y="144" width="140" height="26" rx="5" fill="#ffffff" stroke="#0b3d66" stroke-width="1.8"/>
    <rect x="22" y="178" width="140" height="26" rx="5" fill="#ffffff" stroke="#0b3d66" stroke-width="1.8"/>

    <!-- stages 1-3 -->
    <rect x="196" y="76" width="130" height="50" rx="7" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
    <rect x="196" y="140" width="130" height="50" rx="7" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
    <rect x="196" y="204" width="130" height="50" rx="7" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>

    <!-- the hub -->
    <rect x="364" y="112" width="170" height="106" rx="9" fill="#eef2ff" stroke="#1f4bd8" stroke-width="3"/>

    <!-- edges stage -->
    <rect x="364" y="258" width="170" height="78" rx="7" fill="#fff" stroke="#6741d9" stroke-width="2.2"/>

    <!-- analyze -->
    <rect x="568" y="112" width="174" height="106" rx="7" fill="#fff" stroke="#2f9e44" stroke-width="2.2"/>

    <!-- consume -->
    <rect x="568" y="258" width="174" height="78" rx="7" fill="#b2f2bb" stroke="#14532d" stroke-width="2"/>

    <!-- arrows in -->
    <line x1="166" y1="89" x2="190" y2="95" stroke="#495057" stroke-width="2" marker-end="url(#m3)"/>
    <line x1="166" y1="123" x2="190" y2="110" stroke="#495057" stroke-width="2" marker-end="url(#m3)"/>
    <line x1="166" y1="157" x2="190" y2="226" stroke="#495057" stroke-width="2" marker-end="url(#m3)"/>
    <line x1="166" y1="191" x2="190" y2="238" stroke="#495057" stroke-width="2" marker-end="url(#m3)"/>

    <line x1="261" y1="130" x2="261" y2="136" stroke="#495057" stroke-width="2" marker-end="url(#m3)"/>
    <line x1="330" y1="165" x2="358" y2="165" stroke="#495057" stroke-width="2.5" marker-end="url(#m3)"/>
    <line x1="330" y1="229" x2="358" y2="200" stroke="#495057" stroke-width="2" marker-end="url(#m3)"/>

    <!-- hub <-> edges (write back) -->
    <line x1="440" y1="222" x2="440" y2="254" stroke="#6741d9" stroke-width="2" marker-end="url(#m3)"/>
    <line x1="470" y1="254" x2="470" y2="222" stroke="#6741d9" stroke-width="2.5" marker-end="url(#m3)"/>

    <!-- hub -> analyze -> consume -->
    <line x1="538" y1="165" x2="562" y2="165" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#m3g)"/>
    <line x1="655" y1="222" x2="655" y2="254" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#m3g)"/>
  </g>

  <!-- input labels -->
  <text x="92" y="93" font-size="11.5" font-weight="700" fill="#0b3d66" text-anchor="middle">ntds.dit</text>
  <text x="92" y="127" font-size="11.5" font-weight="700" fill="#0b3d66" text-anchor="middle">SYSTEM hive</text>
  <text x="92" y="161" font-size="11.5" font-weight="700" fill="#0b3d66" text-anchor="middle">SYSVOL</text>
  <text x="92" y="195" font-size="11.5" font-weight="700" fill="#0b3d66" text-anchor="middle">host SAM hives</text>

  <!-- stage labels -->
  <text x="261" y="96" font-size="12.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">① acquire</text>
  <text x="261" y="112" font-size="10" fill="#868e96" text-anchor="middle">hash · confine · ledger</text>
  <text x="261" y="160" font-size="12.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">② parse</text>
  <text x="261" y="176" font-size="10" fill="#868e96" text-anchor="middle">ESE · hives · secrets</text>
  <text x="261" y="224" font-size="12.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">③ normalize</text>
  <text x="261" y="240" font-size="10" fill="#868e96" text-anchor="middle">stable node_id + type</text>

  <!-- hub -->
  <text x="449" y="136" font-size="14" font-weight="700" fill="#1f4bd8" text-anchor="middle">④ CANONICAL GRAPH</text>
  <text x="449" y="155" font-size="10.5" fill="#495057" text-anchor="middle">one DuckDB file per case</text>
  <text x="449" y="171" font-size="10.5" fill="#495057" text-anchor="middle">+ hash-chained ledger</text>
  <text x="449" y="194" font-size="10.5" font-weight="700" fill="#8a6d00" text-anchor="middle">THE FROZEN CONTRACT</text>
  <text x="449" y="209" font-size="9.5" fill="#868e96" text-anchor="middle">every consumer builds on this</text>

  <!-- edges -->
  <text x="449" y="280" font-size="12.5" font-weight="700" fill="#6741d9" text-anchor="middle">⑤ derive edges</text>
  <text x="449" y="297" font-size="10" fill="#495057" text-anchor="middle">ACEs · delegation · GPO</text>
  <text x="449" y="312" font-size="10" fill="#495057" text-anchor="middle">AD CS · host SAM</text>
  <text x="449" y="329" font-size="9.5" font-weight="700" fill="#3a2f6b" text-anchor="middle">written BACK into ④</text>

  <!-- analyze -->
  <text x="655" y="136" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">⑥ analyze</text>
  <text x="655" y="153" font-size="10" fill="#495057" text-anchor="middle">Tier-0 · attack paths</text>
  <text x="655" y="168" font-size="10" fill="#495057" text-anchor="middle">risk · hunter queries</text>
  <text x="655" y="183" font-size="10" fill="#495057" text-anchor="middle">dossiers · ESC verdicts</text>
  <text x="655" y="205" font-size="9.5" font-weight="700" fill="#2f9e44" text-anchor="middle">READ-ONLY</text>

  <!-- consume -->
  <text x="655" y="281" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">⑦ consume</text>
  <text x="655" y="299" font-size="10" fill="#14532d" text-anchor="middle">WebGL graph · dossier PDF</text>
  <text x="655" y="314" font-size="10" fill="#14532d" text-anchor="middle">BloodHound export</text>
  <text x="655" y="330" font-size="9.5" font-weight="700" fill="#14532d" text-anchor="middle">swappable adapters</text>

  <!-- footer note -->
  <g filter="url(#sk3)">
    <rect x="22" y="378" width="720" height="74" rx="8" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.8" stroke-dasharray="6 4"/>
  </g>
  <text x="38" y="400" font-size="12" font-weight="700" fill="#495057">Why the hub matters</text>
  <text x="38" y="420" font-size="11.5" fill="#1e1e1e">Analysis never touches parser output. Every consumer — the UI, the PDF, the BloodHound export — is built against the same</text>
  <text x="38" y="438" font-size="11.5" fill="#1e1e1e">frozen store contract. That is what makes BloodHound an export <tspan font-weight="700">adapter</tspan>, not the foundation.</text>
</svg>
