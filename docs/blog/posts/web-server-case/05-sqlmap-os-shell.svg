    <line x1="136" y1="388" x2="514" y2="388" stroke="#c92a2a" stroke-width="2" marker-end="url(#mr)"/>
    <line x1="136" y1="442" x2="514" y2="442" stroke="#c92a2a" stroke-width="2" marker-end="url(#mr)"/>
    <line x1="136" y1="496" x2="514" y2="496" stroke="#c92a2a" stroke-width="2" marker-end="url(#mr)"/>
