  <text x="22" y="32" font-size="20" font-weight="700" fill="#1e1e1e" text-anchor="start">Investigation path</text>
  <text x="22" y="53" font-size="12.5" font-weight="400" fill="#868e96" text-anchor="start">two hypotheses tested in parallel; every arrow is a pivot chosen by what the last step found</text>
  <text x="97.0" y="254" font-size="12.5" font-weight="700" fill="#0b3d66" text-anchor="middle">Prepare evidence</text>
  <text x="97.0" y="273" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">AIM write-temporary</text>
  <text x="97.0" y="288" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">KAPE !SANS_Triage</text>
  <text x="97.0" y="303" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">memory → MemProcFS</text>
  <text x="271.0" y="254" font-size="12.5" font-weight="700" fill="#0b3d66" text-anchor="middle">Profile the host</text>
  <text x="271.0" y="273" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">OS · TZ · network</text>
  <text x="271.0" y="288" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">accounts (SAM vs</text>
  <text x="271.0" y="303" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">ProfileList)</text>
  <text x="266" y="346" font-size="10.5" font-weight="400" fill="#868e96" text-anchor="start">two hypotheses, tested side by side</text>
  <text x="481.0" y="112" font-size="12.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">H-OS: Windows-level</text>
  <text x="481.0" y="131" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">Hayabusa (Sigma) +</text>
  <text x="481.0" y="146" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">EvtxECmd / Timeline Explorer</text>
  <text x="693.0" y="112" font-size="12.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">4625 burst, 23 Aug</text>
  <text x="693.0" y="131" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">user 'Student' from 10.20.0.118</text>
  <text x="693.0" y="146" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">no matching 4624</text>
  <text x="888" y="126" font-size="12.5" font-weight="700" fill="#495057" text-anchor="middle">ruled out</text>
  <text x="888" y="143" font-size="10.5" font-weight="400" fill="#868e96" text-anchor="middle">lab noise on build day</text>
  <text x="481.0" y="258" font-size="12.5" font-weight="700" fill="#2f9e44" text-anchor="middle">H-WEB: web application</text>
  <text x="481.0" y="277" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">Application.evtx →</text>
  <text x="481.0" y="292" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">XAMPP + MySQL 5.6.25</text>
  <text x="693.0" y="258" font-size="12.5" font-weight="700" fill="#2f9e44" text-anchor="middle">access.log → CSV</text>
  <text x="693.0" y="277" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">stack by User-Agent</text>
  <text x="693.0" y="292" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">and source IP</text>
  <text x="896.0" y="258" font-size="12.5" font-weight="700" fill="#2f9e44" text-anchor="middle">Attacks found</text>
  <text x="896.0" y="277" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">XSS · exec · LFI</text>
  <text x="896.0" y="292" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">sqlmap · uploads</text>
  <text x="593" y="335" font-size="10.5" font-weight="400" fill="#2f9e44" text-anchor="start">pivot: UA = sqlmap, Iceweasel</text>
  <text x="896.0" y="396" font-size="12.5" font-weight="700" fill="#6741d9" text-anchor="middle">Files deleted</text>
  <text x="896.0" y="415" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">FTK, PhotoRec: nothing</text>
  <text x="896.0" y="430" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">→ $I30 + USN journal</text>
  <text x="693.0" y="396" font-size="12.5" font-weight="700" fill="#6741d9" text-anchor="middle">Memory</text>
  <text x="693.0" y="415" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">httpd.exe strings: POST bodies</text>
  <text x="693.0" y="430" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">cmdscan: console history</text>
  <text x="481.0" y="396" font-size="12.5" font-weight="700" fill="#6741d9" text-anchor="middle">Registry + EVTX</text>
  <text x="481.0" y="415" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">SAM: user1 / hacker</text>
  <text x="481.0" y="430" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">09:00:39 fail in both</text>
  <text x="652" y="474" font-size="10.5" font-weight="400" fill="#6741d9" text-anchor="start">pivot: POST bodies missing from the log</text>
  <text x="388" y="474" font-size="10.5" font-weight="400" fill="#6741d9" text-anchor="start">pivot: account names + times</text>
  <text x="298" y="526" font-size="13.5" font-weight="700" fill="#14532d" text-anchor="middle">One UTC timeline → root cause → ATT&amp;CK + Diamond</text>
  <text x="298" y="546" font-size="11" font-weight="400" fill="#495057" text-anchor="middle">every claim tied to an artefact and checked against a second one</text>
</svg>
