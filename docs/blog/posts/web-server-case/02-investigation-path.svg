    <rect x="196" y="230" width="150" height="92" rx="7" fill="#eef2ff" stroke="#0b3d66" stroke-width="2"/>
    <line x1="172" y1="276" x2="192" y2="276" stroke="#495057" stroke-width="2" marker-end="url(#mg)"/>
    <path d="M346,276 C362,276 362,130 384,130" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#mg)"/>
    <path d="M346,276 C362,276 362,276 384,276" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#mg)"/>
    <rect x="388" y="88" width="186" height="84" rx="7" fill="#ffffff" stroke="#495057" stroke-width="2"/>
    <rect x="600" y="88" width="186" height="84" rx="7" fill="#ffffff" stroke="#495057" stroke-width="2"/>
    <line x1="574" y1="130" x2="596" y2="130" stroke="#495057" stroke-width="2" marker-end="url(#mg)"/>
    <ellipse cx="888" cy="130" rx="92" ry="34" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
    <line x1="786" y1="130" x2="792" y2="130" stroke="#495057" stroke-width="2" marker-end="url(#mg)"/>
    <rect x="388" y="234" width="186" height="84" rx="7" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
    <rect x="600" y="234" width="186" height="84" rx="7" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
    <rect x="812" y="234" width="168" height="84" rx="7" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
    <line x1="574" y1="276" x2="596" y2="276" stroke="#2f9e44" stroke-width="2" marker-end="url(#mgr)"/>
    <line x1="786" y1="276" x2="808" y2="276" stroke="#2f9e44" stroke-width="2" marker-end="url(#mgr)"/>
    <rect x="812" y="372" width="168" height="84" rx="7" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/>
    <rect x="600" y="372" width="186" height="84" rx="7" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/>
