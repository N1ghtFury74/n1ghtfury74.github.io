<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Kalam', 'Comic Sans MS', cursive" role="img" aria-label="Diamond Model of the intrusion">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="sk" x="-2%" y="-3%" width="104%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
    <marker id="mg" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mr" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#c92a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mgr" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mb" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#1f4bd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mo" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mp" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#6741d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mm" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#868e96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <g filter="url(#sk)">
    <line x1="500" y1="120" x2="200" y2="330" stroke="#868e96" stroke-width="1.6"/>
    <line x1="500" y1="120" x2="800" y2="330" stroke="#868e96" stroke-width="1.6"/>
    <line x1="500" y1="540" x2="200" y2="330" stroke="#868e96" stroke-width="1.6"/>
    <line x1="500" y1="540" x2="800" y2="330" stroke="#868e96" stroke-width="1.6"/>
    <line x1="200" y1="330" x2="800" y2="330" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 5"/>
    <line x1="500" y1="120" x2="500" y2="540" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 5"/>
    <rect x="350.0" y="65.0" width="300" height="110" rx="7" fill="#fff5f5" stroke="#c92a2a" stroke-width="2.4"/>
    <rect x="65.0" y="266.0" width="270" height="128" rx="7" fill="#f3f0ff" stroke="#6741d9" stroke-width="2.4"/>
    <rect x="665.0" y="266.0" width="270" height="128" rx="7" fill="#fff4e6" stroke="#e8590c" stroke-width="2.4"/>
    <rect x="340.0" y="485.0" width="320" height="110" rx="7" fill="#eef2ff" stroke="#1f4bd8" stroke-width="2.4"/>
    <rect x="380" y="300" width="240" height="60" rx="30" fill="#ffffff" stroke="#495057" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-size="20" font-weight="700" fill="#1e1e1e" text-anchor="start">Diamond Model of the intrusion</text>
  <text x="22" y="53" font-size="12.5" font-weight="400" fill="#868e96" text-anchor="start">one event chain, four vertices; the edges are what the evidence actually connects</text>
  <text x="500" y="89.0" font-size="14.5" font-weight="700" fill="#c92a2a" text-anchor="middle">Adversary</text>
  <text x="500" y="109.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">hands-on operator, works DVWA module by module</text>
  <text x="500" y="124.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">console on the host + Kali box, 19 s apart</text>
  <text x="500" y="139.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">commodity tools, no stealth beyond sqlmap clean-up</text>
  <text x="200" y="290.0" font-size="14.5" font-weight="700" fill="#6741d9" text-anchor="middle">Capability</text>
  <text x="200" y="310.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">sqlmap 1.0-dev (--os-shell)</text>
  <text x="200" y="325.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">phpshell.php · c99.php · phpshell2.php</text>
  <text x="200" y="340.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">net.exe · netsh.exe (living off the land)</text>
  <text x="200" y="355.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">XSS · LFI · command injection</text>
  <text x="800" y="290.0" font-size="14.5" font-weight="700" fill="#e8590c" text-anchor="middle">Infrastructure</text>
  <text x="800" y="310.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">192.168.56.102 — Iceweasel / Kali</text>
  <text x="800" y="325.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">same /24 as the victim (host-only lab)</text>
  <text x="800" y="340.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">HTTP to port 80; reverse stager</text>
  <text x="800" y="355.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">interactive console on the server</text>
  <text x="500" y="509.0" font-size="14.5" font-weight="700" fill="#1f4bd8" text-anchor="middle">Victim</text>
  <text x="500" y="529.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">WIN-L0ZZQ76PMUF · 192.168.56.101</text>
  <text x="500" y="544.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">Server 2008 SP1 · XAMPP · DVWA (low)</text>
  <text x="500" y="559.0" font-size="10.5" font-weight="400" fill="#1e1e1e" text-anchor="middle">MySQL FILE privilege · no process auditing</text>
  <text x="500" y="326" font-size="12.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">web app → database → OS</text>
  <text x="500" y="344" font-size="10.5" font-weight="400" fill="#495057" text-anchor="middle">every pivot reused a granted privilege</text>
</svg>
